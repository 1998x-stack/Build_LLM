name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint canonical code
        run: python -m ruff check src common tests run_all.py examples tools
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Lecture smoke tests
        run: python run_all.py
